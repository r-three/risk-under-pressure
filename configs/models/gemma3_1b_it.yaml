# Target — Gemma 3 1B Instruction-Tuned (Google, released 2025-03).
#
# Middle rung of the Gemma 3 size ladder (270M -> 1B -> 4B) in the model-size study.
#
# Text-only Gemma3ForCausalLM (999,885,952 params) — the same checkpoint size as
# gemma3_1b_it_abliterated, which is the attacker-side counterpart of this model. That
# config loads in 4-bit on purpose (the attacker ablation compares wall-clock across
# attacker sizes); this one follows the target-side size policy instead, so the numbers
# are not interchangeable between the two.
#
# quantization: none per the repo's size policy (<=1B unquantized) — see the GPU memory
# guide in the README.
model_id: "gemma3-1b-it"
backend: "huggingface"
hf_name: "google/gemma-3-1b-it"
params_b: 1.00
model_type: "instruct"
model_class: "causal_lm"
quantization: "none"
# Gemma 3 activations exceed the float16 range: in float16 this checkpoint emits
# multilingual token soup instead of text, silently (generation raises nothing).
# bfloat16 is the dtype Google ships it for and is required for coherent output.
torch_dtype: "bfloat16"
device: "cuda"
generation:
  max_new_tokens: 512
  temperature: 0.7
  do_sample: true
  top_p: 0.9
