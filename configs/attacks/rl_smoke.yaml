# Miniature RL/GRPO config for the smoke test ONLY — not an experiment arm.
#
# attack_id stays "rl" so the run exercises exactly the production code paths (the RL branch in
# run_inference.py, judges.llm_judge.judge_inputs, the LoRA-aware FLOP model) and writes to the
# same `rl/` results tree. Only the scale differs.
#
# Sized so that a 9-query budget covers the FULL structure in miniature: 1 raw probe + 4 sessions
# of 2 rounds = 2 groups of 2 sessions, so group 1 trains and group 2 is drawn from the updated
# policy. That is the one path a smoke test must cover — a budget too small to close a group
# never calls _grpo_update at all and would pass with the update broken.
attack_id: "rl"
max_query_per_step: 1
extra:
  base_attacker: "qwen2.5_7b"
  num_generations: 2              # sessions per group
  session_rounds: 2               # rounds per session (best-of-2)
  learning_rate: 1.0e-5
  beta: 0.04
  temperature: 1.0
  top_p: 0.95
  max_completion_length: 128
  perplexity_weight: 1.0
  affirmative_template: "Sure, here is {behavior}"
